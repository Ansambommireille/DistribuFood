<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Distributed Cloud Storage</title>
<style>
  body { font-family: 'Segoe UI', sans-serif; background: #0d1117; color: #c9d1d9; padding: 40px; }
  .container { max-width: 700px; margin: auto; background: #161b22; padding: 30px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.5); }
  input, button { padding: 12px; margin: 8px 0; width: 100%; border-radius: 8px; border: none; }
  button { background: #238636; color: white; cursor: pointer; font-weight: bold; }
  button:hover { background: #2ea043; }
  a { color: #58a6ff; cursor: pointer; }
  #signupArea, #otpArea, #storageArea { display: none; }
  .file-item { padding: 10px; background: #21262d; margin: 8px 0; border-radius: 8px; display: flex; justify-content: space-between; align-items: center; }
  .file-item button { width: auto; padding: 8px 16px; margin-left: 10px; }
  #progress-container { width: 100%; background: #21262d; border-radius: 8px; margin: 15px 0; height: 20px; }
  #progress-bar { height: 100%; background: #238636; width: 0%; border-radius: 8px; transition: width 0.3s; }
  #storage-info { background: #21262d; padding: 15px; border-radius: 8px; margin: 20px 0; }
  .logout-btn { background: #da3633; margin-top: 40px; }
  .logout-btn:hover { background: #f85149; }
</style>
</head>
<body>
<div class="container">
  <h1>Distributed Cloud Storage</h1>

  <div id="loginArea">
    <h2>Log In</h2>
    <input type="text" id="loginUsername" placeholder="Username">
    <input type="password" id="loginPass" placeholder="Password">
    <button onclick="login()">Send OTP</button>
    <p>Don't have an account? <a onclick="showSignup()">Create one here</a></p>
  </div>

  <div id="signupArea">
    <h2>Sign Up</h2>
    <input type="text" id="regUsername" placeholder="Username">
    <input type="email" id="regEmail" placeholder="Email">
    <input type="password" id="regPass" placeholder="Password">
    <button onclick="signup()">Create Account</button>
    <p>Already have an account? <a onclick="showLogin()">Log in here</a></p>
  </div>

  <div id="otpArea">
    <h2>Enter OTP (check your email)</h2>
    <input type="text" id="otpInput" placeholder="6-digit code">
    <button onclick="verifyOtp()">Verify & Login</button>
  </div>

  <div id="storageArea">
    <h2>Welcome!</h2>
    
    <div id="storage-info">
  <strong>Storage Status</strong><br>
  Total: 1.25 GB<br>
  Used: 0.00 GB<br>
  Available: 1.25 GB<br>
  Your Files: 0
</div>

    <input type="file" id="fileInput">
    <button onclick="upload()">Upload File</button>
    
    <div id="progress-container">
      <div id="progress-bar"></div>
    </div>

    <h3>Your Files</h3>
    <div id="list"></div>

    <button class="logout-btn" onclick="logout()">Logout</button>
  </div>
</div>

<script>
function showLogin() { /* same as before */ 
  document.getElementById("signupArea").style.display = "none";
  document.getElementById("loginArea").style.display = "block";
  document.getElementById("otpArea").style.display = "none";
  document.getElementById("storageArea").style.display = "none";
}

function showSignup() { /* same */ 
  document.getElementById("loginArea").style.display = "none";
  document.getElementById("signupArea").style.display = "block";
  document.getElementById("otpArea").style.display = "none";
  document.getElementById("storageArea").style.display = "none";
}

function showOtp() { /* same */ 
  document.getElementById("loginArea").style.display = "none";
  document.getElementById("signupArea").style.display = "none";
  document.getElementById("otpArea").style.display = "block";
  document.getElementById("storageArea").style.display = "none";
}

function showStorage() {
  document.getElementById("loginArea").style.display = "none";
  document.getElementById("signupArea").style.display = "none";
  document.getElementById("otpArea").style.display = "none";
  document.getElementById("storageArea").style.display = "block";
  loadFiles();
  loadStorageInfo();
}

async function signup() { /* same as before */ 
  const username = document.getElementById("regUsername").value;
  const email = document.getElementById("regEmail").value;
  const pass = document.getElementById("regPass").value;
  const res = await fetch("/signup", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ username, email, password: pass })
  });
  const json = await res.json();
  alert(json.message);
  if (json.success) showLogin();
}

async function login() { /* same */ 
  const username = document.getElementById("loginUsername").value;
  const pass = document.getElementById("loginPass").value;
  const res = await fetch("/login", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ username, password: pass })
  });
  const json = await res.json();
  if (json.success) {
    showOtp();
  } else {
    alert(json.message);
  }
}

async function verifyOtp() { /* same */ 
  const otp = document.getElementById("otpInput").value;
  const res = await fetch("/verify-otp", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ otp })
  });
  const json = await res.json();
  if (json.success) {
    showStorage();
  } else {
    alert(json.message);
  }
}

function upload() {
  const file = document.getElementById("fileInput").files[0];
  if (!file) return alert("Please select a file");

  const fd = new FormData();
  fd.append("file", file);

  const xhr = new XMLHttpRequest();
  xhr.open("POST", "/upload", true);

  xhr.upload.onprogress = function(e) {
    if (e.lengthComputable) {
      const percent = (e.loaded / e.total) * 100;
      document.getElementById("progress-bar").style.width = percent + "%";
    }
  };

  xhr.onload = function() {
    const json = JSON.parse(xhr.responseText);
    alert(json.message || json.error);
    document.getElementById("progress-bar").style.width = "0%";
    loadFiles();
    loadStorageInfo();
  };

  xhr.onerror = function() {
    alert("Upload failed");
    document.getElementById("progress-bar").style.width = "0%";
  };

  xhr.send(fd);
}

async function loadFiles() {
  const res = await fetch("/files");
  if (!res.ok) return;
  const json = await res.json();
  const list = document.getElementById("list");
  list.innerHTML = "";
  (json.files || []).forEach(name => {
    const div = document.createElement("div");
    div.className = "file-item";
    div.innerHTML = `<span>${name}</span>`;
    const dl = document.createElement("button");
    dl.textContent = "Download";
    dl.onclick = () => location.href = `/download/${encodeURIComponent(name)}`;
    const del = document.createElement("button");
    del.textContent = "Delete";
    del.style.background = "#da3633";
    del.onclick = async () => {
      await fetch(`/delete/${encodeURIComponent(name)}`, { method: "POST" });
      loadFiles();
      loadStorageInfo();
    };
    div.append(dl, del);
    list.appendChild(div);
  });
}

async function loadStorageInfo() {
  const res = await fetch("/storage_info");
  if (!res.ok) {
    document.getElementById("storage-info").innerHTML = "Error loading storage info";
    return;
  }
  const data = await res.json();
  document.getElementById("storage-info").innerHTML = `
    <strong>Storage Status</strong><br>
    Total: ${data.total_gb} GB<br>
    Used: ${data.used_gb} GB<br>
    Available: ${data.available_gb} GB<br>
    Your Files: ${data.file_count}
  `;
}

function logout() {
  location.reload();
}

showLogin();
</script>
</body>
</html>
