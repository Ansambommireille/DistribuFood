syntax = "proto3";

package storage;

service StorageNode {
  rpc StoreBlock(StoreRequest) returns (StoreResponse);
  rpc GetBlock(GetRequest) returns (GetResponse);
  rpc DeleteBlock(DeleteRequest) returns (DeleteResponse);
  rpc GetAvailableSpace(Empty) returns (SpaceResponse);
}

message StoreRequest {
  string block_id = 1;
  bytes data = 2;
}

message StoreResponse {
  bool success = 1;
  string message = 2;
}

message GetRequest {
  string block_id = 1;
}

message GetResponse {
  bool success = 1;
  bytes data = 2;
  string message = 3;
}

message DeleteRequest {
  string block_id = 1;
}

message DeleteResponse {
  bool success = 1;
  string message = 2;
}

message Empty {}

message SpaceResponse {
  int64 available = 1;
}